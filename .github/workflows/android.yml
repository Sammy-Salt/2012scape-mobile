name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # JRE 8: taken from the official 2009Scape-mobile release APK (hd-2.4).
      # The old CI artifacts (PojavLauncherTeam/android-openjdk-build-multiarch) have expired.
      - name: Get JRE 8 (from 2009Scape release APK)
        run: |
          set -e
          wget -q -O base.apk https://github.com/2009scape/2009Scape-mobile/releases/download/hd-2.4/2009Scape-HD-2.4-debug.apk
          echo "ccc622be8d72f0506643b4cc955768123f1436f601ceab4611048807262936cd  base.apk" | sha256sum -c -
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          unzip -q -j base.apk 'assets/components/jre/*' -d app_pojavlauncher/src/main/assets/components/jre
          rm base.apk
          ls -la app_pojavlauncher/src/main/assets/components/jre

      # JRE 17 (arm64 only, personal use on a 64-bit phone): upstream release jre17-ec28559 (archived repo, files still served).
      - name: Get JRE 17 (arm64)
        run: |
          set -e
          D=app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p $D
          wget -q -O $D/jre17-arm64-20210825-release.tar.xz https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-ec28559/jre17-arm64-20210825-release.tar.xz
          echo "c64583ac2e0ec8857e43456fa9adcf482c6a8e454a7133173bf15692d2478b8d  $D/jre17-arm64-20210825-release.tar.xz" | sha256sum -c -
          ls -la $D

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6.1

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk
